name: Build PigeonBridge APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find and unzip PigeonBridge
        run: |
          mkdir -p build-source
          unzip -q "PigeonBridge-background-processing.zip" -d build-source

          echo "Project contents:"
          find build-source -maxdepth 2 -type f | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Android APK
        working-directory: build-source/android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PigeonBridge-debug-apk
          path: build-source/android/app/build/outputs/apk/debug/app-debug.apk
          
